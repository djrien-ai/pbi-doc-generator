name: CI

on:
  push:
    branches: [main, "v*.*", "feat/**"]
  pull_request:
    branches: [main, "v*.*"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Verify CLI version
        run: pbi-doc-generator --version

      - name: Compile all Python modules
        run: python -m compileall -q .

      - name: Run v1.1 test suite & demo portal smoke check
        run: |
          python tests/test_v1_suite.py
          python scripts/build_demo_portal.py

      - name: Verify clean-room wheel build, requirements.txt & non-editable pip install from empty folder
        if: matrix.python-version == '3.12'
        shell: pwsh
        run: |
          $expectedVer = (python -c "import pbi_catalog; print(pbi_catalog.__version__)").Trim()
          python -m pip install -r requirements.txt build twine
          python -m pip uninstall -y pbi-doc-generator
          python -m build
          twine check dist/*
          $whl = (Get-ChildItem dist/*.whl | Select-Object -First 1).FullName
          python -m pip install $whl
          $cleanDir = Join-Path ([System.IO.Path]::GetTempPath()) ("pbidoc_clean_pip_" + [guid]::NewGuid().ToString("N").Substring(0,8))
          New-Item -ItemType Directory -Force -Path $cleanDir | Out-Null
          Push-Location $cleanDir
          try {
            $v = pbi-doc-generator --version
            if ($LASTEXITCODE -ne 0 -or $v -notmatch [regex]::Escape($expectedVer)) { throw "Wheel CLI --version failed: $v (expected $expectedVer)" }
            $smDir = Join-Path $cleanDir "TestModel.SemanticModel/definition/tables"
            New-Item -ItemType Directory -Force -Path $smDir | Out-Null
            Set-Content -Path (Join-Path $cleanDir "TestModel.SemanticModel/definition/model.tmdl") -Value "model Model`n`tculture: en-US`n"
            Set-Content -Path (Join-Path $smDir "Sales.tmdl") -Value "table Sales`n`tmeasure Rev = SUM(Sales[Amt])`n`tcolumn Amt`n`t`tdataType: double`n`t`tsourceColumn: Amt`n`tpartition Sales = m`n`t`tmode: import`n`t`tsource =`n`t`t`tlet Source = Sql.Database(`"srv`", `"db`") in Source`n"
            $cat = Join-Path $cleanDir "cat"
            pbi-doc-generator import-local (Join-Path $cleanDir "TestModel.SemanticModel") --catalog $cat
            if ($LASTEXITCODE -ne 0) { throw "import-local from installed wheel failed!" }
            pbi-doc-generator export-site --catalog $cat --format single -o (Join-Path $cleanDir "sp.html")
            if ($LASTEXITCODE -ne 0 -or -not (Test-Path (Join-Path $cleanDir "sp.html"))) { throw "export-site from installed wheel failed!" }
            pbi-doc-generator measure-doc "Rev" --catalog $cat -o (Join-Path $cleanDir "rev.md")
            if ($LASTEXITCODE -ne 0 -or -not (Test-Path (Join-Path $cleanDir "rev.md"))) { throw "measure-doc from installed wheel failed!" }
            Write-Host "[PASS] Clean-room non-editable wheel install ($expectedVer) verified outside repo directory!"
          } finally {
            Pop-Location
            Remove-Item -Recurse -Force $cleanDir -ErrorAction SilentlyContinue
          }
