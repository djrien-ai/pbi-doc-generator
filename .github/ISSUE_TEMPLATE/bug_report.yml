name: Bug Report
description: Report a bug in Power BI / Fabric scanning, Report X-Ray, Dataflows, PDF/SharePoint export, local files, or MCP server
labels: ["bug"]
body:
  - type: dropdown
    id: mode
    attributes:
      label: Area / Feature
      options:
        - Power BI Service / Microsoft Fabric Scanner
        - Slide-Over Report X-Ray / Visual Layouts (PBIR or report.json)
        - Dataflow Gen1 / Fabric Dataflow Gen2 / Direct Lake Lineage
        - Export / Print A4 PDF / SharePoint Online Publish
        - Documentation Portal UI / Star-Schema / DAX Catalog
        - Local .pbix file
        - Local .pbip / .SemanticModel project
        - Local Excel PowerPivot (.xlsx)
        - MCP Server (10 read-only tools)
        - Windows Portable ZIP
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the issue and how to reproduce it (please redact any private tenant names, workspace URLs, or credentials).
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Version, OS & Installation Method
      placeholder: e.g. Windows 11 - Portable ZIP v1.1.0, or Python 3.12 via pip
