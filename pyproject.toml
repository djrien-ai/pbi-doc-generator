[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pbi-doc-generator"
version = "1.0.0"
description = "Power BI Workspace Catalog, Semantic Model Documentation, Interactive Live Lineage & MCP Server"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Rien Scheerlinck", email = "dj.rien@gmail.com"},
]
keywords = ["power-bi", "fabric", "tmdl", "pbix", "documentation", "data-lineage", "mcp", "dax"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Documentation",
    "Topic :: Database",
]

dependencies = [
    "pbixray>=0.15.5",
    "pandas>=2.0.0,<3.0.0",
    "playwright>=1.40.0",
]

[project.optional-dependencies]
all = [
    "pbixray>=0.15.5",
    "pandas>=2.0.0,<3.0.0",
    "playwright>=1.40.0",
]

[project.urls]
Homepage = "https://github.com/djrien-ai/pbi-doc-generator"
"Live Demo" = "https://djrien-ai.github.io/pbi-doc-generator/"
Repository = "https://github.com/djrien-ai/pbi-doc-generator"
Issues = "https://github.com/djrien-ai/pbi-doc-generator/issues"
"Author LinkedIn" = "https://www.linkedin.com/in/rien-scheerlinck/"

[project.scripts]
pbi-doc-generator = "pbi_catalog.cli:main"

[tool.setuptools]
packages = ["pbi_catalog"]
py-modules = ["launcher", "extract", "html_template", "pbip_adapter", "tmdl_parser", "dax_parser", "mermaid_js", "excel_extractor"]
